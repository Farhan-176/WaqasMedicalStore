<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-icon-monogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="grad-leaf-monogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <circle cx="60" cy="60" r="56" fill="url(#grad-icon-monogram)" />
  
  <!-- Outer Pulse Accent Ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35" />
  
  <!-- Medical Cross Background Accent -->
  <path d="M 52 28 H 68 V 52 H 92 V 68 H 68 V 92 H 52 V 68 H 28 V 52 H 52 Z" fill="rgba(255, 255, 255, 0.15)" />

  <!-- Integrated Leaf Accent Top Right -->
  <path d="M 60 14 C 78 14 90 28 90 42 C 90 45 88 47 84 47 C 72 47 60 36 60 14 Z" fill="url(#grad-leaf-monogram)" />
  
  <!-- Pulse Line Graphic -->
  <path d="M 18 60 L 32 60 L 38 46 L 46 74 L 54 52 L 60 66 L 66 60 L 102 60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Monogram Text: WMS -->
  <text x="60" y="71" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="-1">WMS</text>
</svg>
